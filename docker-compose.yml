# One-command local stack: `docker compose up`
# Web: http://localhost:3000   API: http://localhost:4000   Swagger: http://localhost:4000/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: varaq
      POSTGRES_PASSWORD: varaq
      POSTGRES_DB: varaq
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varaq"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: postgresql://varaq:varaq@postgres:5432/varaq?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-only-secret-change-me-please-0123456789
      CONTACT_HASH_PEPPER: dev-only-pepper
      CORS_ORIGIN: http://localhost:3000
      DEV_FIXED_OTP: "123456"
    ports: ["${API_HOST_PORT:-4000}:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      target: web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["${WEB_HOST_PORT:-3000}:3000"]
    depends_on: [api]

volumes:
  pgdata:
