name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varaq/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Migrations and seed against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: varaq
          POSTGRES_PASSWORD: varaq
          POSTGRES_DB: varaq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U varaq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://varaq:varaq@localhost:5432/varaq?schema=public
      JWT_SECRET: ci-only-secret-0123456789abcdef
      CONTACT_HASH_PEPPER: ci-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - name: Seed twice (must be idempotent)
        run: |
          pnpm db:seed
          pnpm db:seed
